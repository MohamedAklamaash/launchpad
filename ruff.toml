[lint]
ignore = [
    "E402",   # module-level import not at top — required by Django settings
    "E701",   # multiple statements on one line
    "E702",   # statement ends with semicolon
    "E741",   # ambiguous variable name
]

[lint.per-file-ignores]
# Django generates these; numeric-prefixed filenames and literal dependency/operation
# lists are the framework's own convention, not something to rewrite.
"**/migrations/*.py" = ["RUF012", "N999"]
