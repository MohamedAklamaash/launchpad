name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository; none needs a writable GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  check-iam-policy:
    name: IAM policy drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The customer-facing policy exists in three places: the heredoc in
      # create_aws_role.sh and both JSON blocks in docs/IAM_POLICIES.md. All three are
      # rendered from policy.json — a hand-edit to any of them fails here. Stdlib only,
      # so no install step and no Django settings.
      - name: Policy source-of-truth check
        run: >-
          python deployment-services/infrastructure-service/api/cloud_providers/aws/iam_policy/generate.py
          --check

  test-onboarding-script:
    name: Onboarding script tests (create_aws_role.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs create_aws_role.sh against a stubbed `aws` CLI (app_scripts/tests/fake_aws.sh):
      # trust-policy ExternalId merge, compute-type union, and the F8 refusal on a
      # CloudFormation-managed role. No AWS credentials needed.
      - name: Trust-policy and exclusivity tests
        run: bash app_scripts/tests/test_multi_infra_trust_policy.sh

  check-cfn-template:
    name: CFN template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cfn-lint
        # Pinned, same discipline as check-python's ruff==0.16.5: an unpinned install
        # means an unrelated commit can turn CI red when cfn-lint cuts a new release.
        run: pip install cfn-lint==1.57.2

      # Structural validation over the generated templates' output, not a dependency of
      # generate.py itself (stays stdlib-only). No AWS credentials, same offline posture
      # as check-terraform's `validate`.
      - name: Lint generated CFN templates
        run: >-
          cfn-lint
          deployment-services/infrastructure-service/api/cloud_providers/aws/iam_policy/cloudformation/launchpad-deployment-role.ecs-fargate.template.json
          deployment-services/infrastructure-service/api/cloud_providers/aws/iam_policy/cloudformation/launchpad-deployment-role.eks.template.json

  check-python:
    name: Lint & Syntax (python services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway-service
          - payment-service
          - deployment-services
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned: an unpinned install means a new ruff release can turn CI red on a
        # commit that changed nothing. Bump deliberately.
        run: pip install ruff==0.16.5

      - name: Syntax check
        run: python -m compileall ${{ matrix.service }} -q

      - name: Ruff lint
        run: ruff check ${{ matrix.service }}

  check-identity:
    name: Lint & Typecheck (identity-services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity-services
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: identity-services/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: identity-services/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build common
        run: pnpm --filter @launchpad/common build

      - name: Prettier
        run: pnpm format

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm -r --workspace-root=false exec tsc --noEmit

      - name: Unit tests (auth-service)
        run: pnpm --filter auth-service test

      - name: Unit tests (notification-service)
        run: pnpm --filter notification-service test

      - name: Unit tests (user-service)
        run: pnpm --filter user-service test

  test-python:
    name: Tests (deployment-services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            deployment-services/requirements.txt
            payment-service/requirements.txt

      - name: Install dependencies
        run: >-
          pip install -r deployment-services/requirements.txt -r payment-service/requirements.txt
          pytest==9.1.1 pytest-django==4.12.0

      - name: application-service tests
        run: python -m pytest -q
        working-directory: deployment-services/application-service

      - name: infrastructure-service tests
        run: python -m pytest -q
        working-directory: deployment-services/infrastructure-service

      - name: payment-service tests
        run: python -m pytest -q
        working-directory: payment-service

  check-frontend:
    name: Lint & Typecheck (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launchpad-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launchpad-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: npx tsc --noEmit

      # Lint + tsc don't catch build-time failures: Vercel was broken for three weeks
      # while CI stayed green. Build through a no-op adapter, standalone output on, the
      # same path Vercel's adapter takes (see scripts/ci-noop-adapter.mjs).
      - name: Build (adapter path, as on Vercel)
        run: pnpm run build
        env:
          NEXT_ADAPTER_PATH: ${{ github.workspace }}/launchpad-frontend/scripts/ci-noop-adapter.mjs
          NEXT_TELEMETRY_DISABLED: "1"

  check-terraform:
    name: Format & Validate (terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.0

      - name: Terraform fmt
        run: |
          terraform fmt -check -recursive deployment-services/infrastructure-service/infra/aws
          terraform fmt -check -recursive infra/platform-dns
          terraform fmt -check -recursive infra/platform-builder

      - name: Terraform validate (modules)
        run: |
          for module in deployment-services/infrastructure-service/infra/aws/modules/*/; do
            echo "::group::${module}"
            terraform -chdir="${module}" init -backend=false -input=false
            terraform -chdir="${module}" validate
            echo "::endgroup::"
          done

      # Platform-owned, unlike every module above. It writes DNS for all tenants, so a
      # typo in its IAM condition is not something to discover at apply time.
      - name: Terraform validate (platform-dns)
        run: |
          terraform -chdir=infra/platform-dns init -backend=false -input=false
          terraform -chdir=infra/platform-dns validate

      # Platform-owned, same reasoning as platform-dns above: this is where every customer
      # build runs, so a credential-scoping typo here is not something to discover at
      # apply time either.
      - name: Terraform validate (platform-builder)
        run: |
          terraform -chdir=infra/platform-builder init -backend=false -input=false
          terraform -chdir=infra/platform-builder validate
