name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-python:
    name: Lint & Syntax (python services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway-service
          - payment-service
          - deployment-services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Syntax check
        run: python -m compileall ${{ matrix.service }} -q

      - name: Ruff lint
        run: ruff check ${{ matrix.service }}

  check-identity:
    name: Lint & Typecheck (identity-services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity-services
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: identity-services/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: identity-services/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build common
        run: pnpm --filter @launchpad/common build

      - name: Prettier
        run: pnpm format

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm -r --workspace-root=false exec tsc --noEmit

      - name: Unit tests (auth-service)
        run: pnpm --filter auth-service test

      - name: Unit tests (notification-service)
        run: pnpm --filter notification-service test

  test-python:
    name: Tests (deployment-services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deployment-services/requirements.txt

      - name: Install dependencies
        run: pip install -r deployment-services/requirements.txt pytest==9.1.1 pytest-django==4.12.0

      - name: application-service tests
        run: python -m pytest -q
        working-directory: deployment-services/application-service

      - name: infrastructure-service tests
        run: python -m pytest -q
        working-directory: deployment-services/infrastructure-service

  check-frontend:
    name: Lint & Typecheck (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launchpad-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launchpad-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: npx tsc --noEmit

  check-terraform:
    name: Format & Validate (terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.0

      - name: Terraform fmt
        run: terraform fmt -check -recursive deployment-services/infrastructure-service/infra/aws

      - name: Terraform validate (modules)
        run: |
          for module in deployment-services/infrastructure-service/infra/aws/modules/*/; do
            echo "::group::${module}"
            terraform -chdir="${module}" init -backend=false -input=false
            terraform -chdir="${module}" validate
            echo "::endgroup::"
          done
